[project]
name = "freecad-ai"
version = "0.1.0"
description = "Chat with any Agent Client Protocol (ACP) agent inside FreeCAD"
readme = "README.md"
license = "MIT"
# FreeCAD 1.1 bundles Python 3.11; the addon runs on that interpreter.
requires-python = ">=3.11"
dependencies = []

[tool.uv]
# A FreeCAD addon, installed by copying into Mod/, not a pip package.
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# macOS's case-insensitive filesystem makes `FreeCAD` look like the local `freecad/`
# package, so pin both sides or import order differs between macOS and CI.
known-first-party = ["freecad"]
known-third-party = ["FreeCAD", "FreeCADGui"]

[tool.mypy]
python_version = "3.11"
files = ["freecad", "tests"]
explicit_package_bases = true
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Provided by FreeCAD at runtime; no stubs on PyPI.
module = ["FreeCAD", "FreeCADGui", "PySide", "PySide.*", "PySide6", "PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Qt widgets subclass PySide classes, which mypy sees as Any (FreeCAD's PySide has no stubs).
module = ["freecad.acp_chat.ui", "freecad.acp_chat.init_gui"]
disallow_subclassing_any = false
disallow_untyped_decorators = false  # QtCore.Slot

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]
